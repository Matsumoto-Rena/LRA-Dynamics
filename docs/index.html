<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Tracking (Multi-Mode)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #222; color: #fff; }
        video { display: none; }
        
        canvas { 
            border: 4px solid #555; 
            background-color: #000;
            width: 100%;       
            max-width: 800px; 
            height: auto;      
            border-radius: 8px;
        }
        
        .btn-group { margin: 20px 0; }
        button { font-size: 1.1em; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; }
        
        /* ボタンの色分け */
        .btn-start { background-color: #4CAF50; color: white; }
        .btn-connect { background-color: #2196F3; color: white; }
        .btn-mode { background-color: #FF9800; color: white; font-weight: bold;}
        .btn-reset { background-color: #9E9E9E; color: white; }

        #status { font-size: 1.2em; margin-bottom: 10px; color: #FF9800; min-height: 1.5em;}
        #loading { font-size: 1.1em; color: #aaa; margin-bottom: 10px;}
    </style>
</head>
<body>
    <h1>Blue Tracking (Multi-Mode)</h1>

    <div id="loading">OpenCV.js ロード中...</div>
    <div id="status">モード: 絶対座標 (0-255)</div>
    
    <canvas id="canvas"></canvas>
    <video id="webcam" autoplay playsinline></video>

    <div class="btn-group">
        <button id="startButton" class="btn-start">① カメラ起動</button>
        <button id="connectButton" class="btn-connect">② Bluetooth 接続</button>
    </div>

    <div class="btn-group">
        <button id="setOriginButton" class="btn-mode">📍 ここを原点にする (相対モード)</button>
        <button id="resetModeButton" class="btn-reset">絶対座標に戻す</button>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script>
        let video, canvas, ctx;
        let startButton, connectButton, setOriginButton, resetModeButton;
        let loading, statusText;
        let bleDevice, bleCharacteristic;
        let cv; 

        const PROCESS_WIDTH = 640; 
        
        // ★追加: 通信プロトコルの定義
        const MODE_ABS = 1;
        const MODE_REL = 2;

        let isRelativeMode = false;
        let originX = 0;
        let originY = 0;
        let requestOriginReset = false; 

        window.onload = () => {
            video = document.getElementById('webcam');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            startButton = document.getElementById('startButton');
            connectButton = document.getElementById('connectButton');
            setOriginButton = document.getElementById('setOriginButton');
            resetModeButton = document.getElementById('resetModeButton');
            loading = document.getElementById('loading');
            statusText = document.getElementById('status');

            startButton.onclick = startCamera;
            connectButton.onclick = connectBluetooth;
            
            setOriginButton.onclick = () => { requestOriginReset = true; };
            resetModeButton.onclick = () => {
                isRelativeMode = false;
                statusText.textContent = "モード: 絶対座標 (0-255)";
                statusText.style.color = "#FF9800";
            };

            waitForOpenCV();
        };

        function waitForOpenCV() {
            if (window.cv && window.cv.Mat) {
                cv = window.cv;
                loading.textContent = "OpenCV.js 準備完了！";
            } else {
                setTimeout(waitForOpenCV, 500);
            }
        }

        async function startCamera() {
            if (!cv) { alert("OpenCV.js ロード中..."); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); 
                requestAnimationFrame(processVideo);
            } catch (err) {
                console.error(err);
                alert("カメラ起動失敗: " + err);
            }
        }

        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) {
                    requestAnimationFrame(processVideo);
                    return;
                }

                let vw = video.videoWidth;
                let vh = video.videoHeight;
                
                if (vw > 0 && vh > 0) {
                    let aspect = vh / vw;
                    canvas.width = PROCESS_WIDTH;
                    canvas.height = PROCESS_WIDTH * aspect;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let src = cv.matFromImageData(imgData);
                let hsv = new cv.Mat();
                let mask = new cv.Mat();

                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                let lowScalar = new cv.Scalar(100, 60, 20); 
                let highScalar = new cv.Scalar(140, 255, 255);
                let lowMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), lowScalar);
                let highMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), highScalar);

                cv.inRange(hsv, lowMat, highMat, mask);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;
                let totalPixels = canvas.width * canvas.height;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);
                    if (area < 20) continue;
                    if (area > totalPixels / 4) continue;
                    if (area > maxArea) {
                        maxArea = area;
                        bestContour = cnt;
                    }
                }

                if (bestContour) {
                    let rect = cv.boundingRect(bestContour);
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [0, 255, 0, 255], 3);

                    let centerX = rect.x + rect.width / 2;
                    let centerY = rect.y + rect.height / 2;
                    let normX = Math.round((centerX / canvas.width) * 255);
                    let normY = Math.round((centerY / canvas.height) * 255);
                    
                    if (requestOriginReset) {
                        originX = normX;
                        originY = normY;
                        isRelativeMode = true;
                        requestOriginReset = false;
                        statusText.textContent = `モード: 相対座標 (原点: ${originX}, ${originY})`;
                        statusText.style.color = "#00E676";
                    }

                    let sendX, sendY;
                    let currentMode; // モード番号

                    if (isRelativeMode) {
                        // モード2: 相対
                        let diffX = normX - originX;
                        let diffY = normY - originY;
                        sendX = Math.max(0, Math.min(255, diffX + 127));
                        sendY = Math.max(0, Math.min(255, diffY + 127));
                        
                        // ★ここが重要: モードIDを設定
                        currentMode = MODE_REL; 
                        
                        let oX = (originX / 255) * canvas.width;
                        let oY = (originY / 255) * canvas.height;
                        cv.drawMarker(src, new cv.Point(oX, oY), [0, 0, 255, 255], cv.MARKER_CROSS, 20, 2);

                    } else {
                        // モード1: 絶対
                        sendX = normX;
                        sendY = normY;
                        
                        // ★ここが重要: モードIDを設定
                        currentMode = MODE_ABS; 
                    }

                    // ★修正: 3バイト送信 [モード, X, Y]
                    sendBleData(new Uint8Array([currentMode, sendX, sendY])).catch(e => {});

                    let text = `Mode:${currentMode} X:${sendX} Y:${sendY}`;
                    cv.putText(src, text, new cv.Point(10, 40), cv.FONT_HERSHEY_SIMPLEX, 0.8, [255, 255, 255, 255], 2);
                }

                cv.imshow('canvas', src);

                src.delete(); hsv.delete(); mask.delete();
                contours.delete(); hierarchy.delete();
                lowMat.delete(); highMat.delete();

            } catch (err) {
                console.error(err);
            }
            requestAnimationFrame(processVideo);
        }

        async function connectBluetooth() {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) {
                console.error(err);
                alert("接続失敗: " + err);
            }
        }

        async function sendBleData(dataArray) {
            if (bleCharacteristic) {
                await bleCharacteristic.writeValue(dataArray.buffer);
            }
        }
    </script>
</body>
</html>
