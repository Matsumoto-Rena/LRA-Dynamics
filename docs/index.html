<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Controller (Red Tracking)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #222; color: #fff; }
        
        canvas { 
            border: 4px solid #ff3333; /* 枠線を赤っぽくしました */
            background-color: #000;
            width: 100%; max-width: 640px; height: auto; border-radius: 8px;
        }
        video { display: none; }

        button { cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-sys { font-size: 1.1em; padding: 10px 20px; margin: 5px; background-color: #607D8B; color: white; }
        
        .mode-tabs { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        .tab { padding: 10px 30px; font-size: 1.2em; opacity: 0.5; transition: 0.3s; background: #444; color: #fff;}
        .tab.active { opacity: 1; background-color: #E91E63; transform: scale(1.1); box-shadow: 0 0 10px #E91E63;}

        #save-area { margin-top: 20px; display: none; }
        .btn-save { font-size: 1.1em; padding: 10px 20px; background-color: #E91E63; color: white; }
        .btn-clear { font-size: 1.1em; padding: 10px 20px; background-color: #9E9E9E; color: white; margin-left: 10px; }

        #dpad-area { display: none; margin: 20px auto; width: 200px; height: 200px; position: relative; }
        .d-btn { 
            position: absolute; width: 60px; height: 60px; 
            background: #444; color: white; font-size: 24px;
            border-radius: 10px; user-select: none;
        }
        .d-btn:active { background: #E91E63; }
        .d-btn.disabled { opacity: 0.3; pointer-events: none; }

        #btn-up    { top: 0; left: 70px; }
        #btn-down  { bottom: 0; left: 70px; }
        #btn-left  { top: 70px; left: 0; }
        #btn-right { top: 70px; right: 0; }

        #status { font-size: 1.2em; margin-bottom: 10px; color: #aaa; min-height: 1.5em; }
        #loading { font-size: 1.1em; color: #aaa; margin-bottom: 10px;}
    </style>
</head>
<body>
    <h1>Hybrid Controller (Red Tracking)</h1>
    <div id="loading">OpenCV.js ロード中...</div>
    <div id="status">準備中...</div>

    <canvas id="canvas"></canvas>
    <video id="webcam" autoplay playsinline></video>

    <div>
        <button id="startButton" class="btn-sys">① カメラ起動</button>
        <button id="connectButton" class="btn-sys">② Bluetooth 接続</button>
    </div>

    <hr style="border-color: #444; margin: 20px;">

    <div class="mode-tabs">
        <button id="mode1Btn" class="tab active">Mode 1: 3秒記録</button>
        <button id="mode2Btn" class="tab">Mode 2: 自動追尾</button>
    </div>

    <div id="save-area">
        <span id="log-count">データ数: 0</span>
        <br><br>
        <button id="saveBtn" class="btn-save">💾 CSV保存</button>
        <button id="clearBtn" class="btn-clear">🗑️ クリア</button>
    </div>

    <div id="dpad-area">
        <button id="btn-up" class="d-btn">▲</button>
        <button id="btn-left" class="d-btn">◀</button>
        <button id="btn-right" class="d-btn">▶</button>
        <button id="btn-down" class="d-btn">▼</button>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script>
        // --- 1. 定数定義 ---
        const HEADER_MANUAL = 0x01;
        const HEADER_AUTO   = 0x02;
        const DIR_STOP = 0, DIR_UP = 1, DIR_DOWN = 2, DIR_LEFT = 3, DIR_RIGHT = 4;
        
        let lastSendTime = 0;       
        const SEND_INTERVAL = 200; 
        let isSending = false;      

        let video, canvas, ctx;
        let bleDevice, bleCharacteristic;
        let cv; 
        let currentMode = 1; 
        let latestX = 0, latestY = 0;
        let originX = 0, originY = 0;

        let recordedData = [];
        let isRecording = false;
        let recordStartTime = 0;
        let currentDirectionStr = "";

        // --- 2. 関数定義 ---

        function waitForOpenCV() {
            if (window.cv && window.cv.Mat) {
                cv = window.cv;
                document.getElementById('loading').textContent = "OpenCV.js 準備完了！";
            } else {
                setTimeout(waitForOpenCV, 500);
            }
        }

        async function startCamera() {
            if (!cv) { alert("OpenCVロード中..."); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); 
                requestAnimationFrame(processVideo);
            } catch (err) { alert("カメラエラー: " + err); }
        }

        async function connectBluetooth() {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true, optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) { alert("接続失敗: " + err); }
        }

        async function sendBleData(data) {
            if (!bleCharacteristic || isSending) return;
            if (Date.now() - lastSendTime < SEND_INTERVAL) return;
            try {
                isSending = true;
                await bleCharacteristic.writeValue(data);
                lastSendTime = Date.now();
            } catch (err) { console.error(err); } 
            finally { isSending = false; }
        }

        async function sendManualCommand(code) {
            if (!bleCharacteristic) return;
            try {
                await bleCharacteristic.writeValue(new Uint8Array([HEADER_MANUAL, code, 0]));
            } catch(e){}
        }

        // ★修正版: 動き出す瞬間に原点をセットする
        function startMoveSequence(dirCode, dirName) {
            if (currentMode !== 1 || isRecording) return;
            
            // 赤丸が見つかっていない(座標が0)なら動かない安全策
            if (latestX === 0 && latestY === 0) {
                alert("赤丸が見つかりません！");
                return;
            }

            // ★ここが修正ポイント！
            // ボタンを押した瞬間の座標を「原点」として更新する
            originX = latestX;
            originY = latestY;

            isRecording = true;
            recordStartTime = Date.now();
            currentDirectionStr = dirName;
            
            toggleButtons(false);
            sendManualCommand(dirCode);
            document.getElementById('status').textContent = `動作中: ${dirName} (3秒間)`;

            setTimeout(() => {
                sendManualCommand(DIR_STOP);
                isRecording = false;
                toggleButtons(true);
                document.getElementById('status').textContent = "待機中 (ボタンを押してください)";
                updateLogCount();
            }, 3000);
        }

        function toggleButtons(enable) {
            const btns = document.querySelectorAll('.d-btn');
            btns.forEach(b => {
                if(enable) b.classList.remove('disabled');
                else b.classList.add('disabled');
            });
        }

        function saveCSV() {
            if (recordedData.length === 0) {
                alert("データがありません");
                return;
            }
            let csvContent = "Time(ms),Input,RawX,RawY,RelX,RelY\n";
            recordedData.forEach(row => {
                csvContent += `${row.time},${row.input},${row.x},${row.y},${row.relX},${row.relY}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `red_log_${Date.now()}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function clearLog() {
            recordedData = [];
            updateLogCount();
        }

        function updateLogCount() {
            document.getElementById('log-count').textContent = `データ数: ${recordedData.length}行`;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode1Btn').className = mode === 1 ? 'tab active' : 'tab';
            document.getElementById('mode2Btn').className = mode === 2 ? 'tab active' : 'tab';
            
            const status = document.getElementById('status');
            const dpad = document.getElementById('dpad-area');
            const saveArea = document.getElementById('save-area');

            if (mode === 1) {
                status.textContent = "モード1: 3秒記録モード (原点設定済)";
                status.style.color = "#E91E63";
                dpad.style.display = "block"; 
                saveArea.style.display = "block"; 
                originX = latestX;
                originY = latestY;
            } else {
                status.textContent = "モード2: 赤色自動追尾中...";
                status.style.color = "#00E676";
                dpad.style.display = "none"; 
                saveArea.style.display = "none";
            }
        }

        function setupDpad() {
            document.getElementById('btn-up').onclick    = () => startMoveSequence(DIR_UP, "UP");
            document.getElementById('btn-down').onclick  = () => startMoveSequence(DIR_DOWN, "DOWN");
            document.getElementById('btn-left').onclick  = () => startMoveSequence(DIR_LEFT, "LEFT");
            document.getElementById('btn-right').onclick = () => startMoveSequence(DIR_RIGHT, "RIGHT");
        }

        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) return;

                let vw = video.videoWidth;
                let vh = video.videoHeight;
                if (vw > 0 && vh > 0) {
                    let aspect = vh / vw;
                    canvas.width = 640; canvas.height = 640 * aspect;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                let src = cv.matFromImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let hsv = new cv.Mat();
                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                // --- 🔴 赤色認識ロジック (ここが変わりました) ---
                let mask = new cv.Mat();
                let mask1 = new cv.Mat();
                let mask2 = new cv.Mat();

                // 赤の範囲1 (0〜10)
                let low1 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(0, 100, 80));
                let high1 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(10, 255, 255));
                cv.inRange(hsv, low1, high1, mask1);

                // 赤の範囲2 (170〜180)
                let low2 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(170, 100, 80));
                let high2 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(180, 255, 255));
                cv.inRange(hsv, low2, high2, mask2);

                // 2つの範囲を合体
                cv.bitwise_or(mask1, mask2, mask);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);
                    if (area > 20 && area > maxArea) {
                        maxArea = area;
                        bestContour = cnt;
                    }
                }

                if (bestContour) {
                    let rect = cv.boundingRect(bestContour);
                    // 枠線を赤色に
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [255, 0, 0, 255], 3);

                    let cx = rect.x + rect.width / 2;
                    let cy = rect.y + rect.height / 2;
                    latestX = Math.round((cx / canvas.width) * 255);
                    latestY = Math.round((cy / canvas.height) * 255);

                    if (currentMode === 1) {
                        let ox = (originX / 255) * canvas.width;
                        let oy = (originY / 255) * canvas.height;
                        cv.drawMarker(src, new cv.Point(ox, oy), [255, 255, 0, 255], cv.MARKER_CROSS, 20, 2);
                        
                        if (isRecording) {
                            let currentTime = Date.now() - recordStartTime;
                            recordedData.push({
                                time: currentTime,
                                input: currentDirectionStr,
                                x: latestX,
                                y: latestY,
                                relX: latestX - originX,
                                relY: latestY - originY
                            });
                            cv.circle(src, new cv.Point(30, 30), 10, [255, 0, 0, 255], -1); 
                            cv.putText(src, "REC", new cv.Point(50, 40), cv.FONT_HERSHEY_SIMPLEX, 0.8, [255, 0, 0, 255], 2);
                        } else {
                            cv.putText(src, "Mode 1: Red Log Ready", new cv.Point(10, 40), cv.FONT_HERSHEY_SIMPLEX, 0.8, [255, 255, 255, 255], 2);
                        }

                    } else if (currentMode === 2) {
                        sendBleData(new Uint8Array([HEADER_AUTO, latestX, latestY]));
                        let text = `Auto(Red): ${latestX}, ${latestY}`;
                        cv.putText(src, text, new cv.Point(10, 40), cv.FONT_HERSHEY_SIMPLEX, 1.0, [255, 255, 255, 255], 2);
                    }
                }

                cv.imshow('canvas', src);
                // メモリ解放 (増えた分も忘れずに)
                src.delete(); hsv.delete(); mask.delete(); mask1.delete(); mask2.delete();
                low1.delete(); high1.delete(); low2.delete(); high2.delete();
                contours.delete(); hierarchy.delete();

            } catch (err) { console.error(err); } 
            finally { requestAnimationFrame(processVideo); }
        }

        window.onload = () => {
            video = document.getElementById('webcam');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            document.getElementById('startButton').onclick = startCamera;
            document.getElementById('connectButton').onclick = connectBluetooth;
            document.getElementById('mode1Btn').onclick = () => setMode(1);
            document.getElementById('mode2Btn').onclick = () => setMode(2);
            document.getElementById('saveBtn').onclick = saveCSV;
            document.getElementById('clearBtn').onclick = clearLog;

            setupDpad();
            setMode(1);
            waitForOpenCV();
        };
    </script>
</body>
</html>
