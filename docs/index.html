<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV.js & Web Bluetooth</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; }
        /* video は裏で動かすため非表示に */
        video { display: none; }
        /* canvas に枠線をつけて、video の代わりに見せる */
        canvas { border: 2px solid #333; width: 80%; max-width: 600px; background-color: #fff; }
        button { font-size: 1.2em; padding: 10px 20px; margin: 10px; }
        #loading { font-size: 1.1em; color: #555; }
    </style>
</head>
<body>
    <h1>Webcam → OpenCV.js → Bluetooth</h1>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div>
        <button id="startButton">① カメラを起動 & 処理開始</button>
        <button id="connectButton">② Bluetooth 接続</button>
    </div>
    
    <div id="loading">OpenCV.js をロード中です...</div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        // willReadFrequently: true は画像処理を高速化するおまじないです
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const startButton = document.getElementById('startButton');
        const connectButton = document.getElementById('connectButton');
        const loading = document.getElementById('loading');

        let bleDevice;
        let bleCharacteristic;
        let cv; 

        // OpenCVロード待ち
        window.onload = () => {
            if (window.cv) {
                cv = window.cv;
                loading.textContent = "OpenCV.js ロード完了！";
                console.log("OpenCV.js ロード完了");
            } else {
                setTimeout(window.onload, 500);
            }
        };

        // --- 1. カメラ起動 ---
        startButton.onclick = async () => {
            if (!cv) { alert("OpenCV.js ロード中..."); return; }
            try {
                // カメラの解像度をリクエストしますが、無視されることもあります
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320, height: 240 }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); // 再生開始

                // キャンバスのサイズを処理しやすいサイズ(320x240)に固定してしまう
                canvas.width = 320;
                canvas.height = 240;
                
                console.log(`処理解像度を ${canvas.width}x${canvas.height} に設定しました`);
                
                // 処理ループ開始
                requestAnimationFrame(processVideo);

            } catch (err) {
                console.error("カメラ起動エラー:", err);
                alert("カメラ起動に失敗しました");
            }
        };

        // --- 2. 画像処理ループ (drawImage方式) ---
        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) {
                    requestAnimationFrame(processVideo);
                    return;
                }

                // ★ここが修正ポイント！ cap.read() を使いません ★
                // 1. カメラ映像(640x480かも)を、Canvas(320x240)に縮小して描画
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 2. Canvasから画像データを吸い出す
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // 3. OpenCVのMatを作成 (毎回作ってもJSなら意外と大丈夫ですが、最適化するなら外に出します)
                let src = cv.matFromImageData(imgData);
                let hsv = new cv.Mat();
                let mask = new cv.Mat();
                
                // --- ここから画像処理 ---
                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB); // RGBへ
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);  // HSVへ

                // 赤色の検出範囲
                let low1  = new cv.Scalar(0, 100, 100);
                let high1 = new cv.Scalar(10, 255, 255);
                let low2  = new cv.Scalar(170, 100, 100);
                let high2 = new cv.Scalar(180, 255, 255);
                
                let mask1 = new cv.Mat();
                let mask2 = new cv.Mat();

                cv.inRange(hsv, low1, high1, mask1);
                cv.inRange(hsv, low2, high2, mask2);
                cv.add(mask1, mask2, mask);

                // 輪郭抽出
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);
                    if (area > maxArea) {
                        maxArea = area;
                        bestContour = cnt;
                    }
                }

                if (bestContour && maxArea > 300) { // ノイズ除去
                    let rect = cv.boundingRect(bestContour);
                    // 緑の枠を描画
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [0, 255, 0, 255], 2);

                    // 中心座標計算 & 送信
                    let centerX = rect.x + rect.width / 2;
                    let centerY = rect.y + rect.height / 2;
                    
                    let normX = Math.round((centerX / canvas.width) * 255);
                    let normY = Math.round((centerY / canvas.height) * 255);
                    
                    // エラー無視して送信
                    sendBleData(new Uint8Array([normX, normY])).catch(e => {});
                }

                // 結果を表示
                cv.imshow('canvas', src);

                // メモリ解放 (これ重要！忘れるとブラウザが重くなります)
                src.delete(); hsv.delete(); mask.delete(); mask1.delete(); mask2.delete(); contours.delete(); hierarchy.delete();

            } catch (err) {
                console.error("処理エラー:", err);
            }
            
            // 次のフレームへ
            requestAnimationFrame(processVideo);
        }

        // --- 3. Bluetooth接続 ---
        connectButton.onclick = async () => {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    // フィルターなしで全デバイス表示（接続トラブル回避のため）
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) {
                console.error(err);
                alert("接続失敗: " + err);
            }
        };

        async function sendBleData(dataArray) {
            if (bleCharacteristic) {
                await bleCharacteristic.writeValue(dataArray.buffer);
            }
        }
    </script>
</body>
</html>
