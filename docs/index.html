<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV.js & Web Bluetooth</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; }
        /* video は裏で動かすため非表示に */
        video { display: none; }
        /* canvas に枠線をつけて、video の代わりに見せる */
        canvas { border: 2px solid #333; width: 80%; max-width: 600px; background-color: #fff; }
        button { font-size: 1.2em; padding: 10px 20px; margin: 10px; }
        #loading { font-size: 1.1em; color: #555; }
    </style>
</head>
<body>
    <h1>Webcam → OpenCV.js → Bluetooth</h1>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div>
        <button id="startButton">① カメラを起動 & 処理開始</button>
        <button id="connectButton">② Bluetooth 接続</button>
    </div>
    
    <div id="loading">OpenCV.js をロード中です...</div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        // willReadFrequently: true は画像処理を高速化するおまじないです
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const startButton = document.getElementById('startButton');
        const connectButton = document.getElementById('connectButton');
        const loading = document.getElementById('loading');

        let bleDevice;
        let bleCharacteristic;
        let cv; 

        // OpenCVロード待ち
        window.onload = () => {
            if (window.cv) {
                cv = window.cv;
                loading.textContent = "OpenCV.js ロード完了！";
                console.log("OpenCV.js ロード完了");
            } else {
                setTimeout(window.onload, 500);
            }
        };

        // --- 1. カメラ起動 ---
        startButton.onclick = async () => {
            if (!cv) { alert("OpenCV.js ロード中..."); return; }
            try {
                // カメラの解像度をリクエストしますが、無視されることもあります
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320, height: 240 }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); // 再生開始

                // キャンバスのサイズを処理しやすいサイズ(320x240)に固定してしまう
                canvas.width = 320;
                canvas.height = 240;
                
                console.log(`処理解像度を ${canvas.width}x${canvas.height} に設定しました`);
                
                // 処理ループ開始
                requestAnimationFrame(processVideo);

            } catch (err) {
                console.error("カメラ起動エラー:", err);
                alert("カメラ起動に失敗しました");
            }
        };

// --- 2. 画像処理ループ (修正版：BindingError対策) ---
        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) {
                    requestAnimationFrame(processVideo);
                    return;
                }

                // 1. 画像取り込み
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // OpenCVのMatを作成
                let src = cv.matFromImageData(imgData);
                let hsv = new cv.Mat();
                let mask = new cv.Mat();
                let mask1 = new cv.Mat();
                let mask2 = new cv.Mat();

                // HSV変換
                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                // --- ★ここが修正ポイント！ ---
                // Scalar（ただの数値）を、Mat（画像データ）に変換してから inRange に渡します
                
                // 範囲1：濃いオレンジ〜濃い赤
                let low1Scalar = new cv.Scalar(0, 120, 80); 
                let high1Scalar = new cv.Scalar(15, 255, 255);

                // 範囲2：濃いピンク〜濃い赤
                let low2Scalar = new cv.Scalar(160, 120, 80); 
                let high2Scalar = new cv.Scalar(180, 255, 255);

                // ★★ Scalar を Mat に変換！ ★★
                // (画像のサイズと同じ大きさの「真っ赤な画像」などを一時的に作ります)
                let low1Mat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), low1Scalar);
                let high1Mat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), high1Scalar);
                let low2Mat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), low2Scalar);
                let high2Mat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), high2Scalar);

                // inRange には Mat を渡す
                cv.inRange(hsv, low1Mat, high1Mat, mask1);
                cv.inRange(hsv, low2Mat, high2Mat, mask2);
                cv.add(mask1, mask2, mask);

                // 輪郭抽出
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);
                    
                    // 1. まず面積が小さすぎるゴミは無視
                    if (area < 100) continue;

                    // 2. 周囲の長さを計算
                    let perimeter = cv.arcLength(cnt, true);
                    if (perimeter === 0) continue;

                    // 3. 円形度を計算 (4 * π * 面積 / 周囲の長さの2乗)
                    let circularity = (4 * Math.PI * area) / (perimeter * perimeter);

                    // ★ここが重要★
                    // 「一番大きくて」かつ「円形度が 0.75 以上（丸っぽい）」ものだけ選ぶ
                    // (PCのような四角い物体は 0.78 以下になることが多いので、0.8〜0.85くらいが理想ですが、
                    //  カメラの歪みを考慮して一旦 0.75 で試します)
                    if (circularity > 0.75) { 
                        if (area > maxArea) {
                            maxArea = area;
                            bestContour = cnt;
                        }
                    }
                }

                if (bestContour && maxArea > 20) { // 小さいゴミも拾うように 20 に設定
                    let rect = cv.boundingRect(bestContour);
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [0, 255, 0, 255], 2);

                    // 座標計算 & 送信
                    let centerX = rect.x + rect.width / 2;
                    let centerY = rect.y + rect.height / 2;
                    let normX = Math.round((centerX / canvas.width) * 255);
                    let normY = Math.round((centerY / canvas.height) * 255);
                    
                    sendBleData(new Uint8Array([normX, normY])).catch(e => {});
                }

                // 結果を表示（デバッグ用に mask を表示してもOK）
                cv.imshow('canvas', src); 
                // cv.imshow('canvas', mask); // ← 真っ黒画面で確認したい時はこちら

                // ★★ お掃除（メモリ解放）これ超重要 ★★
                // 作ったMatを全部消さないとブラウザがクラッシュします
                src.delete(); hsv.delete(); 
                mask.delete(); mask1.delete(); mask2.delete(); 
                contours.delete(); hierarchy.delete();
                // 新しく作ったMatも忘れずに消す！
                low1Mat.delete(); high1Mat.delete(); low2Mat.delete(); high2Mat.delete();

            } catch (err) {
                console.error("処理エラー:", err);
            }
            
            requestAnimationFrame(processVideo);
        }

        // --- 3. Bluetooth接続 ---
        connectButton.onclick = async () => {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    // フィルターなしで全デバイス表示（接続トラブル回避のため）
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) {
                console.error(err);
                alert("接続失敗: " + err);
            }
        };

        async function sendBleData(dataArray) {
            if (bleCharacteristic) {
                await bleCharacteristic.writeValue(dataArray.buffer);
            }
        }
    </script>
</body>
</html>
