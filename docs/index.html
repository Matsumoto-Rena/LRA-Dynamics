<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Tracking (4:3 Max FOV)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #222; color: #fff; }
        video { display: none; }
        
        canvas { 
            border: 4px solid #555; 
            background-color: #000;
            width: 100%;       
            max-width: 800px; 
            height: auto;      
            border-radius: 8px;
        }
        
        button { font-size: 1.2em; padding: 12px 24px; margin: 10px; cursor: pointer; }
        #loading { font-size: 1.1em; color: #aaa; margin-bottom: 10px;}
    </style>
</head>
<body>
    <h1>Blue Tracking (4:3 Max FOV)</h1>

    <div id="loading">OpenCV.js ロード中...</div>
    
    <canvas id="canvas"></canvas>
    <video id="webcam" autoplay playsinline></video>

    <div>
        <button id="startButton">① カメラ起動</button>
        <button id="connectButton">② Bluetooth 接続</button>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

    <script>
        let video, canvas, ctx;
        let startButton, connectButton, loading;
        let bleDevice, bleCharacteristic;
        let cv; 

        // 処理用の解像度
        const PROCESS_WIDTH = 640; 

        window.onload = () => {
            video = document.getElementById('webcam');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            startButton = document.getElementById('startButton');
            connectButton = document.getElementById('connectButton');
            loading = document.getElementById('loading');

            startButton.onclick = startCamera;
            connectButton.onclick = connectBluetooth;

            waitForOpenCV();
        };

        function waitForOpenCV() {
            if (window.cv && window.cv.Mat) {
                cv = window.cv;
                loading.textContent = "OpenCV.js 準備完了！";
            } else {
                setTimeout(waitForOpenCV, 500);
            }
        }

        async function startCamera() {
            if (!cv) { alert("OpenCV.js ロード中..."); return; }
            try {
                // ★修正ポイント：ここを 4:3 の比率に戻す！
                // これでカメラセンサーの上下いっぱいまで使えます
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 800 },  // 800x600 (4:3) を希望
                        height: { ideal: 600 } 
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); 
                requestAnimationFrame(processVideo);
            } catch (err) {
                console.error(err);
                alert("カメラ起動失敗: " + err);
            }
        }

        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) {
                    requestAnimationFrame(processVideo);
                    return;
                }

                // カメラの比率に合わせてCanvasサイズを決定
                let vw = video.videoWidth;
                let vh = video.videoHeight;
                
                if (vw > 0 && vh > 0) {
                    let aspect = vh / vw;
                    canvas.width = PROCESS_WIDTH;
                    canvas.height = PROCESS_WIDTH * aspect;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let src = cv.matFromImageData(imgData);
                let hsv = new cv.Mat();
                let mask = new cv.Mat();

                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                // 青色設定
                let lowScalar = new cv.Scalar(100, 60, 20); 
                let highScalar = new cv.Scalar(140, 255, 255);
                let lowMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), lowScalar);
                let highMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), highScalar);

                cv.inRange(hsv, lowMat, highMat, mask);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;
                let totalPixels = canvas.width * canvas.height;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);
                    if (area < 20) continue;
                    if (area > totalPixels / 4) continue;
                    if (area > maxArea) {
                        maxArea = area;
                        bestContour = cnt;
                    }
                }

                if (bestContour) {
                    let rect = cv.boundingRect(bestContour);
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [0, 255, 0, 255], 3);

                    let centerX = rect.x + rect.width / 2;
                    let centerY = rect.y + rect.height / 2;
                    
                    let normX = Math.round((centerX / canvas.width) * 255);
                    let normY = Math.round((centerY / canvas.height) * 255);
                    
                    sendBleData(new Uint8Array([normX, normY])).catch(e => {});

                    let text = `X:${normX} Y:${normY}`;
                    cv.putText(src, text, new cv.Point(10, 40), cv.FONT_HERSHEY_SIMPLEX, 1.0, [255, 255, 255, 255], 2);
                }

                cv.imshow('canvas', src);

                src.delete(); hsv.delete(); mask.delete();
                contours.delete(); hierarchy.delete();
                lowMat.delete(); highMat.delete();

            } catch (err) {
                console.error(err);
            }
            requestAnimationFrame(processVideo);
        }

        async function connectBluetooth() {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) {
                console.error(err);
                alert("接続失敗: " + err);
            }
        }

        async function sendBleData(dataArray) {
            if (bleCharacteristic) {
                await bleCharacteristic.writeValue(dataArray.buffer);
            }
        }
    </script>
</body>
</html>
