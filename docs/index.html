<script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const startButton = document.getElementById('startButton');
        const connectButton = document.getElementById('connectButton');
        const loading = document.getElementById('loading');

        let bleDevice;
        let bleCharacteristic;
        let cv; 

        window.onload = () => {
            if (window.cv) {
                cv = window.cv;
                loading.textContent = "OpenCV.js ロード完了！";
            } else {
                setTimeout(window.onload, 500);
            }
        };

        startButton.onclick = async () => {
            if (!cv) { alert("OpenCV.js ロード中..."); return; }
            try {
                // ★修正1: サイズ指定を削除して、カメラの最大視野を取得
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play(); 

                requestAnimationFrame(processVideo);

            } catch (err) {
                console.error(err);
                alert("カメラ起動失敗");
            }
        };

        function processVideo() {
            try {
                if (!cv || video.paused || video.ended) {
                    requestAnimationFrame(processVideo);
                    return;
                }

                // ★修正2: 比率を保ったまま、横幅320pxにリサイズする
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    const scale = 320 / video.videoWidth;
                    canvas.width = 320;
                    canvas.height = video.videoHeight * scale;
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let src = cv.matFromImageData(imgData);
                let hsv = new cv.Mat();
                let mask = new cv.Mat();

                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                // --- 🔵 青色の設定 ---
                let lowScalar = new cv.Scalar(100, 60, 20); 
                let highScalar = new cv.Scalar(140, 255, 255);

                let lowMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), lowScalar);
                let highMat = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), highScalar);

                cv.inRange(hsv, lowMat, highMat, mask);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestContour = null;
                let totalPixels = canvas.width * canvas.height;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt, false);

                    if (area < 20) continue;
                    if (area > totalPixels / 4) continue;

                    if (area > maxArea) {
                        maxArea = area;
                        bestContour = cnt;
                    }
                }

                if (bestContour) {
                    let rect = cv.boundingRect(bestContour);
                    cv.rectangle(src, new cv.Point(rect.x, rect.y), new cv.Point(rect.x + rect.width, rect.y + rect.height), [0, 255, 0, 255], 2);

                    let centerX = rect.x + rect.width / 2;
                    let centerY = rect.y + rect.height / 2;
                    let normX = Math.round((centerX / canvas.width) * 255);
                    let normY = Math.round((centerY / canvas.height) * 255);
                    
                    sendBleData(new Uint8Array([normX, normY])).catch(e => {});

                    let text = `X: ${normX}, Y: ${normY}`;
                    cv.putText(src, text, new cv.Point(10, 30), cv.FONT_HERSHEY_SIMPLEX, 0.7, [255, 255, 255, 255], 2);
                }

                cv.imshow('canvas', src);

                src.delete(); hsv.delete(); mask.delete();
                contours.delete(); hierarchy.delete();
                lowMat.delete(); highMat.delete();

            } catch (err) {
                console.error("処理エラー:", err);
            }
            
            requestAnimationFrame(processVideo);
        }

        connectButton.onclick = async () => {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続完了！");
            } catch (err) {
                console.error(err);
                alert("接続失敗: " + err);
            }
        };

        async function sendBleData(dataArray) {
            if (bleCharacteristic) {
                await bleCharacteristic.writeValue(dataArray.buffer);
            }
        }
    </script>
