<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Controller (Yellow/Red Markers)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #222; color: #fff; }
        canvas { border: 4px solid #2196F3; background-color: #000; width: 100%; max-width: 640px; height: auto; border-radius: 8px; }
        video { display: none; }
        button { cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-sys { font-size: 1.1em; padding: 10px 20px; margin: 5px; background-color: #607D8B; color: white; }
        .mode-tabs { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        .tab { padding: 10px 30px; font-size: 1.2em; opacity: 0.5; transition: 0.3s; background: #444; color: #fff;}
        .tab.mode1.active { opacity: 1; background-color: #FF9800; transform: scale(1.1); box-shadow: 0 0 10px #FF9800; color: #fff;}
        .tab.mode2.active { opacity: 1; background-color: #2196F3; transform: scale(1.1); box-shadow: 0 0 10px #2196F3; color: #fff;}
        #save-area { margin-top: 20px; display: none; }
        .btn-save { font-size: 1.1em; padding: 10px 20px; background-color: #E91E63; color: white; }
        .btn-clear { font-size: 1.1em; padding: 10px 20px; background-color: #9E9E9E; color: white; margin-left: 10px; }
        #dpad-area { display: none; margin: 20px auto; width: 200px; height: 200px; position: relative; }
        .d-btn { position: absolute; width: 60px; height: 60px; background: #444; color: white; font-size: 24px; border-radius: 10px; user-select: none; }
        .d-btn:active { background: #999; color: #fff; }
        #btn-up { top: 0; left: 70px; } #btn-down { bottom: 0; left: 70px; }
        #btn-left { top: 70px; left: 0; } #btn-right { top: 70px; right: 0; }
        #status { font-size: 1.2em; margin-bottom: 10px; color: #aaa; min-height: 1.5em; }
        #loading { font-size: 1.1em; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Hybrid Controller (Yellow/Red Markers)</h1>
    <div id="loading">OpenCV.js ロード中...</div>
    <div id="status">準備中...</div>
    <canvas id="canvas"></canvas>
    <video id="webcam" autoplay playsinline></video>
    <div>
        <button id="startButton" class="btn-sys">① カメラ起動</button>
        <button id="connectButton" class="btn-sys">② Bluetooth 接続</button>
    </div>
    <hr style="border-color: #444; margin: 20px;">
    <div class="mode-tabs">
        <button id="mode1Btn" class="tab mode1 active">Mode 1: 記録のみ</button>
        <button id="mode2Btn" class="tab mode2">Mode 2: 補正あり</button>
    </div>
    <div id="save-area">
        <span id="log-count">データ数: 0</span>
        <br><br>
        <button id="saveBtn" class="btn-save">💾 CSV保存</button>
        <button id="clearBtn" class="btn-clear">🗑️ クリア</button>
    </div>
    <div id="dpad-area">
        <button id="btn-up" class="d-btn">▲</button>
        <button id="btn-left" class="d-btn">◀</button>
        <button id="btn-right" class="d-btn">▶</button>
        <button id="btn-down" class="d-btn">▼</button>
    </div>
    <script async src="opencv.js"></script>
    <script>
        // ★色設定の変更 (OpenCVのHSV形式: H:0-179, S:0-255, V:0-255)
        
        // 黄色 (Yellow) - 後ろ側 (Back)
        const COLOR_YELLOW_MIN = [20, 100, 100, 0];
        const COLOR_YELLOW_MAX = [40, 255, 255, 255];

        // 赤色 (Red) - 前側 (Front)
        // 赤は色相(H)が0付近と180付近に分かれるため、2つの範囲を定義して合成します
        const COLOR_RED1_MIN = [0, 120, 70, 0];
        const COLOR_RED1_MAX = [10, 255, 255, 255];
        const COLOR_RED2_MIN = [170, 120, 70, 0];
        const COLOR_RED2_MAX = [180, 255, 255, 255];

        const HEADER_MANUAL = 0x01; 
        const DIR_STOP = 0, DIR_UP = 1, DIR_DOWN = 2, DIR_LEFT = 3, DIR_RIGHT = 4;
        
        let video, canvas, ctx, bleDevice, bleCharacteristic, cv; 
        let currentMode = 1; 
        
        let backX = 0, backY = 0;   // 黄色マーカー座標
        let frontX = 0, frontY = 0; // 赤色マーカー座標
        let currentAngle = 0;     

        let originX = 0, originY = 0;
        let originAngle = 0;
        
        let recordedData = []; 
        let isRecording = false; 
        let recordStartTime = 0;
        let isFirstFrame = false; 
        
        let lastSentCmd = -1; let isBusy = false;
        let activeCommandStr = "STOP"; let targetDirection = DIR_STOP;
        
        function waitForOpenCV() {
            if (window.cv && window.cv.Mat) { cv = window.cv; document.getElementById('loading').textContent = "OpenCV.js 準備完了！"; } 
            else setTimeout(waitForOpenCV, 500);
        }
        async function startCamera() {
            if (!cv) { alert("OpenCVロード中"); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
                video.srcObject = stream; await video.play(); requestAnimationFrame(processVideo);
            } catch (err) { alert("カメラエラー: " + err); }
        }
        async function connectBluetooth() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['0000aaaa-0000-1000-8000-00805f9b34fb'] });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('0000aaaa-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000bbbb-0000-1000-8000-00805f9b34fb');
                alert("接続完了！");
                document.getElementById('connectButton').style.backgroundColor = "#4CAF50";
            } catch (err) { alert("接続失敗: " + err); }
        }

        async function updateRobotCommand(cmd, strLabel, forceBurst = false) {
            activeCommandStr = strLabel;
            if (!forceBurst && cmd === lastSentCmd) return;
            if (isBusy) return;
            isBusy = true; 
            try { 
                if (forceBurst || cmd === DIR_STOP) await sendBurst(cmd); 
                else await sendSingle(cmd);
                lastSentCmd = cmd;
            } 
            catch (err) { console.error(err); lastSentCmd = -1; } 
            finally { isBusy = false; }
        }
        async function sendSingle(cmd) { if (bleCharacteristic) await bleCharacteristic.writeValue(new Uint8Array([HEADER_MANUAL, cmd, 0])); }
        async function sendBurst(cmd) {
            if (!bleCharacteristic) return;
            for (let i = 0; i < 5; i++) {
                try { await bleCharacteristic.writeValue(new Uint8Array([HEADER_MANUAL, cmd, 0])); } catch(e){} 
                await new Promise(r => setTimeout(r, 20)); 
            }
        }

        function startMoveSequence(dirCode, dirName) {
            if (isRecording) return;
            // 黄色(Back)と赤色(Front)の両方が見つかっているか確認
            if (backX === 0 || frontX === 0) { 
                alert("マーカーが見つかりません！\n黄色(後)と赤色(前)を確認してください。"); 
                return; 
            }
            
            isFirstFrame = true; 
            isRecording = true;
            targetDirection = dirCode;
            toggleButtons(false);
            
            lastSentCmd = -1; 
            updateRobotCommand(dirCode, (currentMode === 1) ? "STRAIGHT(NO_CTRL)" : "STRAIGHT(CTRL)", true);
            
            let modeName = (currentMode === 1) ? "記録のみ" : "補正あり";
            document.getElementById('status').textContent = `走行中 (${modeName}): ${dirName}`;

            setTimeout(async () => {
                console.log("STOPPING...");
                isRecording = false; 
                await new Promise(r => setTimeout(r, 20));
                await updateRobotCommand(DIR_STOP, "STOP", true);
                targetDirection = DIR_STOP;
                toggleButtons(true);
                document.getElementById('status').textContent = "完了";
                updateLogCount();
            }, 4000); 
        }

        function toggleButtons(enable) {
            const btns = document.querySelectorAll('.d-btn');
            btns.forEach(b => { if(enable) b.classList.remove('disabled'); else b.classList.add('disabled'); });
        }
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode1Btn').className = (mode === 1) ? 'tab mode1 active' : 'tab mode1';
            document.getElementById('mode2Btn').className = (mode === 2) ? 'tab mode2 active' : 'tab mode2';
            document.getElementById('dpad-area').style.display = "block"; 
            document.getElementById('save-area').style.display = "block"; 
            if (mode === 1) document.getElementById('status').textContent = "Mode 1: 制御なし (記録のみ)";
            else document.getElementById('status').textContent = "Mode 2: フィードバック制御あり";
        }
        function updateLogCount() { document.getElementById('log-count').textContent = `データ数: ${recordedData.length}行`; }
        function clearLog() { recordedData = []; updateLogCount(); }
        
        function saveCSV() {
            if (recordedData.length === 0) return;
            let csv = "Time(ms),Mode,TargetInput,ActualCommand,BackX,BackY,FrontX,FrontY,RelX,RelY,LocalX,LocalY,Angle(deg)\n";
            recordedData.forEach(r => { 
                csv += `${r.time},${r.mode},${r.input},${r.act},${r.bx},${r.by},${r.fx},${r.fy},${r.relX},${r.relY},${r.locX},${r.locY},${r.angle}\n`; 
            });
            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            const a = document.createElement('a'); a.href = url; a.download = `log_${Date.now()}.csv`; a.click();
        }

        // 指定した色範囲の最大輪郭を見つける関数
        function findLargestContour(hsvMat, minColor, maxColor, minColor2 = null, maxColor2 = null) {
            let mask = new cv.Mat();
            let low = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), new cv.Scalar(...minColor));
            let high = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), new cv.Scalar(...maxColor));
            cv.inRange(hsvMat, low, high, mask);
            low.delete(); high.delete();

            // 赤色のように2つの範囲がある場合の処理
            if (minColor2 && maxColor2) {
                let mask2 = new cv.Mat();
                let low2 = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), new cv.Scalar(...minColor2));
                let high2 = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), new cv.Scalar(...maxColor2));
                cv.inRange(hsvMat, low2, high2, mask2);
                cv.add(mask, mask2, mask); // マスクを結合
                low2.delete(); high2.delete(); mask2.delete();
            }

            let contours = new cv.MatVector(); 
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let maxRect = null;

            for (let i = 0; i < contours.size(); ++i) {
                let area = cv.contourArea(contours.get(i), false);
                // ノイズ除去のため、面積20以上を対象とする
                if (area > 20 && area > maxArea) {
                    maxArea = area;
                    maxRect = cv.boundingRect(contours.get(i));
                }
            }
            
            mask.delete(); contours.delete(); hierarchy.delete();
            return maxRect;
        }

        function processVideo() {
            requestAnimationFrame(processVideo);
            try {
                if (!cv || video.paused || video.ended) return;
                let vw = video.videoWidth; let vh = video.videoHeight;
                if (vw === 0) return;
                
                if (canvas.width !== 640) { canvas.width = 640; canvas.height = 640 * (vh / vw); }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                let src = cv.matFromImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let hsv = new cv.Mat(); cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB); cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
                
                // ★黄色の検出（後ろ）
                let yellowRect = findLargestContour(hsv, COLOR_YELLOW_MIN, COLOR_YELLOW_MAX);
                backX = 0; backY = 0;
                if (yellowRect) {
                    backX = Math.round(yellowRect.x + yellowRect.width/2);
                    backY = Math.round(yellowRect.y + yellowRect.height/2);
                    // 黄色枠描画
                    cv.rectangle(src, new cv.Point(yellowRect.x, yellowRect.y), new cv.Point(yellowRect.x + yellowRect.width, yellowRect.y + yellowRect.height), [255, 255, 0, 255], 2);
                    cv.putText(src, "Back(Y)", new cv.Point(yellowRect.x, yellowRect.y - 5), cv.FONT_HERSHEY_SIMPLEX, 0.5, [255, 255, 0, 255], 1);
                }

                // ★赤色の検出（前） - 2つの色範囲を指定
                let redRect = findLargestContour(hsv, COLOR_RED1_MIN, COLOR_RED1_MAX, COLOR_RED2_MIN, COLOR_RED2_MAX);
                frontX = 0; frontY = 0;
                if (redRect) {
                    frontX = Math.round(redRect.x + redRect.width/2);
                    frontY = Math.round(redRect.y + redRect.height/2);
                    // 赤色枠描画
                    cv.rectangle(src, new cv.Point(redRect.x, redRect.y), new cv.Point(redRect.x + redRect.width, redRect.y + redRect.height), [255, 0, 0, 255], 2);
                    cv.putText(src, "Front(R)", new cv.Point(redRect.x, redRect.y - 5), cv.FONT_HERSHEY_SIMPLEX, 0.5, [255, 0, 0, 255], 1);
                }

                // 2点が見つかったら角度計算と線描画
                if (backX !== 0 && frontX !== 0) {
                    let dx = frontX - backX;
                    let dy = frontY - backY; 
                    let rad = Math.atan2(dy, dx);
                    currentAngle = rad * (180 / Math.PI);
                    
                    cv.line(src, new cv.Point(backX, backY), new cv.Point(frontX, frontY), [0, 255, 255, 255], 3);
                    cv.putText(src, `${Math.round(currentAngle)}deg`, new cv.Point(frontX + 10, frontY), cv.FONT_HERSHEY_SIMPLEX, 0.6, [0, 255, 255, 255], 2);
                } 

                if (isRecording) {
                    if (isFirstFrame && backX !== 0 && frontX !== 0) {
                        originX = backX;
                        originY = backY;
                        originAngle = currentAngle;
                        recordStartTime = Date.now();
                        isFirstFrame = false;
                    }

                    if (!isFirstFrame && backX !== 0) {
                        let timeElapsed = Date.now() - recordStartTime;
                        
                        // --- 制御ロジック (Mode 2) ---
                        if (currentMode === 2) {
                            const DEADZONE = 30; // 許容誤差(ピクセル)
                            let errorX = 0;
                            
                            // 進行方向の基準を「現在の角度」ではなく「開始時の角度」や「画面座標」にする場合は
                            // ここで座標変換をして偏差を求めるのが理想ですが、
                            // 簡易的に「画面上のX座標のズレ」を見る場合は以下で動作します。
                            // (ただし、ロボットが横を向くとX座標制御はY軸制御になる点に注意)
                            
                            // 今回は簡易版として、開始地点(originX)からのX座標のズレを見ます
                            // ※より高度にするなら、進行方向ベクトルに対する垂直距離を計算してください
                            errorX = backX - originX;

                            if (targetDirection === DIR_UP || targetDirection === DIR_DOWN) {
                                // 前進・後退中の左右ズレ補正
                                if (errorX > DEADZONE) updateRobotCommand(DIR_LEFT, "CORRECT_LEFT");
                                else if (errorX < -DEADZONE) updateRobotCommand(DIR_RIGHT, "CORRECT_RIGHT");
                                else updateRobotCommand(targetDirection, "STRAIGHT(CTRL)");
                            }
                        } 
                        
                        // ログ用データの計算
                        let dx = backX - originX;
                        let dy = backY - originY;
                        // ローカル座標変換 (開始時のロボットの向きを基準0度とする)
                        let theta = originAngle * (Math.PI / 180.0);
                        // 回転行列: 
                        // x' = x cosθ + y sinθ
                        // y' = -x sinθ + y cosθ  (※Y軸反転など座標系により符号は調整必要)
                        // ここでは一般的な2D回転を適用
                        let localY = dx * Math.sin(theta) + dy * Math.cos(theta); // 進行方向
                        let localX = dx * Math.cos(theta) - dy * Math.sin(theta); // 横ズレ
                        // ※上記はあくまで一例です。実際のロボットの進行軸に合わせて調整してください。
                        // 今回のコードの元のロジックを維持します：
                        let rotX = dx * Math.cos(-theta) - dy * Math.sin(-theta);
                        let rotY = dx * Math.sin(-theta) + dy * Math.cos(-theta);

                        recordedData.push({ 
                            time: timeElapsed, 
                            mode: currentMode, 
                            input: "AUTO", 
                            act: activeCommandStr, 
                            bx: backX, by: backY, // 生データ
                            fx: frontX, fy: frontY,
                            relX: dx, relY: dy, // スタート地点からの相対
                            locX: Math.round(rotX * 10) / 10, 
                            locY: Math.round(rotY * 10) / 10, 
                            angle: Math.round(currentAngle * 10) / 10
                        });
                    }
                    cv.circle(src, new cv.Point(30, 30), 10, [0, 255, 0, 255], -1); // 緑丸でREC表示
                    cv.putText(src, `REC`, new cv.Point(50, 40), cv.FONT_HERSHEY_SIMPLEX, 0.7, [255, 255, 255, 255], 2);
                }

                if(originX !== 0) {
                     cv.drawMarker(src, new cv.Point(originX, originY), [255, 255, 0, 255], cv.MARKER_CROSS, 20, 2);
                }

                cv.imshow('canvas', src); 
                src.delete(); hsv.delete();
            } catch (err) { console.error(err); }
        }

        window.onload = () => {
            video = document.getElementById('webcam'); canvas = document.getElementById('canvas'); ctx = canvas.getContext('2d', { willReadFrequently: true });
            document.getElementById('startButton').onclick = startCamera; document.getElementById('connectButton').onclick = connectBluetooth;
            document.getElementById('mode1Btn').onclick = () => setMode(1); document.getElementById('mode2Btn').onclick = () => setMode(2);
            document.getElementById('saveBtn').onclick = saveCSV; document.getElementById('clearBtn').onclick = clearLog;
            document.getElementById('btn-up').onclick = () => startMoveSequence(DIR_UP, "UP");
            document.getElementById('btn-down').onclick = () => startMoveSequence(DIR_DOWN, "DOWN");
            document.getElementById('btn-left').onclick = () => startMoveSequence(DIR_LEFT, "LEFT");
            document.getElementById('btn-right').onclick = () => startMoveSequence(DIR_RIGHT, "RIGHT");
            setMode(1); waitForOpenCV();
        };
    </script>
</body>
</html>
